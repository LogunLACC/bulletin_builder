name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "release/**", "cherry/**", "chore/**", harden/**, fix/**, feat/** ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.13']
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff pytest-benchmark

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -e . || echo "Editable install failed"
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pytest ruff pytest-benchmark

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        env:
          PYTHONPATH: src
        run: pytest -v --tb=short

      - name: Run benchmarks
        env:
          PYTHONPATH: src
        run: pytest tests/benchmarks/ -v --benchmark-disable

      - name: Email guard (exports only)
        if: runner.os != 'Windows'
        run: |
          python tools/email_guard.py --changed-only \
            --include "exports/**" \
            --include "dist/email/**" \
            --exclude "user_drafts/**" \
            --exclude "tmp/**"
